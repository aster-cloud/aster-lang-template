name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# 该仓 CI 无发布/部署副作用（release 是独立 workflow），故可直接 cancel 过时 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # aster-lang-core is not (yet) published to a public Maven repo.
      # Lang-pack repos (en/zh/de) and this template fork resolve it from
      # ~/.m2 after `publishToMavenLocal`. Mirror the same pattern as
      # aster-lang-locales/.github/workflows/ci.yml: side-checkout the
      # shared version catalog (aster-lang-platform) + core, publish both
      # locally, then build.
      #
      # External contributors forking this template will need either
      # CROSS_REPO_TOKEN (if the core repo is private) or to point this
      # at a public Maven Central coordinate once aster-lang-core lands
      # there. See README §Build for the local-dev equivalent.

      # 共享版本目录（aster-lang-platform，ADR 0012）：core 的 settings.gradle 用
      # `from("cloud.aster-lang:aster-lang-platform:<ver>")` 拉版本目录，在 settings
      # 评估阶段解析——必须**先**把 platform publish 到 Maven Local，否则 core 的
      # publishToMavenLocal 报 `Could not find cloud.aster-lang:aster-lang-platform`
      # （template CI 此前缺这一步 = pre-existing 构建失败根因；core 引入版本目录后
      # 此仓的跨仓 publish 序列未跟上）。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-core
          path: aster-lang-core
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6

      # 先 publish 版本目录（core settings 依赖它），再 publish core。
      - name: Publish version catalog to Maven Local
        working-directory: aster-lang-platform
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Publish aster-lang-core to Maven Local
        working-directory: aster-lang-core
        run: ./gradlew publishToMavenLocal -x test --no-daemon

      # The unmodified template lexicon (template-XX-XX.json) is full of
      # TODO_TRANSLATE_* placeholders — that's by design, a contributor
      # is supposed to translate them in their fork. validateLexicon
      # would fail on this baseline file, which is correct behaviour for
      # contributors but wrong for the template repo's own CI.
      #
      # Forks: once you rename the lexicon to <lang>-<region>.json and
      # update build.gradle.kts:validateLexicon args, this guard
      # automatically lifts and validateLexicon runs.
      - name: Detect unmodified template
        id: template_check
        run: |
          if [ -f src/main/resources/lexicons/template-XX-XX.json ] && \
             grep -q 'TODO_TRANSLATE_' src/main/resources/lexicons/template-XX-XX.json; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This is the unmodified template scaffold; skipping validateLexicon. Forks should remove template-XX-XX.json after renaming."
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate lexicon JSON
        if: steps.template_check.outputs.is_template != 'true'
        run: ./gradlew validateLexicon --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon
